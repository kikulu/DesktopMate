<!DOCTYPE html>
<html><head><meta charset="utf-8">
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/",
  "three/examples/jsm/": "./node_modules/three/examples/jsm/",
  "@pixiv/three-vrm": "./node_modules/@pixiv/three-vrm/lib/three-vrm.module.js" } }
</script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:transparent;user-select:none}
  #pet{position:absolute;left:0;top:0;width:96px;height:96px;cursor:grab}
  #body{width:96px;height:96px;transition:transform .25s ease-out}
  #pet.drag{cursor:grabbing}
  /* 程式化動作(套用在角色容器上;角色 proceduralMotion:false 時停用) */
  #pet:not(.no-motion).walk #body>div,#pet:not(.no-motion).climb #body>div{animation:bob .35s infinite alternate}
  #pet:not(.no-motion).follow #body>div{animation:bob .2s infinite alternate}
  #pet:not(.no-motion).dance #body>div{animation:wiggle .3s infinite alternate}
  #pet:not(.no-motion).jump #body>div{animation:jump .5s}
  #pet:not(.no-motion).sleep #body>div{transform:translateY(8px) scaleY(.92)}
  @keyframes bob{to{transform:translateY(-6px)}}
  @keyframes wiggle{from{transform:rotate(-12deg)}to{transform:rotate(12deg) translateY(-8px)}}
  @keyframes jump{40%{transform:translateY(-60px)}}
  #bubble{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:nowrap;
    background:#fff;color:#333;font:14px sans-serif;padding:6px 10px;border-radius:12px;
    box-shadow:0 2px 8px #0003;display:none;pointer-events:none}
  #zzz{position:absolute;left:70%;top:-6px;font:bold 16px sans-serif;color:#557;display:none;pointer-events:none;animation:float 2s infinite}
  .sleep #zzz{display:block}
  @keyframes float{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-18px)}}
  /* SVG 角色可用的慣用 class:.eyes-open / .eyes-closed */
  .eyes-closed,.sleep .eyes-open{display:none}.sleep .eyes-closed{display:inline}
</style></head>
<body>
<div id="pet"><div id="bubble"></div><div id="zzz">Z z z</div><div id="body"></div></div>
<script type="module" src="./core.js"></script>
</body></html>
